---
name: chemistry-infographic
services:
    web:
        container_name: oliverperzyk-chemistry-infographic
        restart: unless-stopped
        init: true
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_PORT: ${APP_PORT:-3000}
        environment:
            NODE_ENV: ${NODE_ENV:-production}
        env_file:
            - .env
        ports:
            - "${APP_PORT:-3000}:3000"
